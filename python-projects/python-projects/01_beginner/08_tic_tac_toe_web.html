<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
    }

    h1 { margin: 0 0 10px; font-size: 2.4rem; letter-spacing: 2px; }

    .status {
      font-size: 1.3rem;
      min-height: 2rem;
      margin-bottom: 16px;
    }

    .scores {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }
    .scores span { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 8px; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
      background: #fff;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .cell {
      background: #eef3fb;
      border: none;
      border-radius: 8px;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .cell:hover:not(:disabled) { background: #d6e2f5; }
    .cell:active:not(:disabled) { transform: scale(0.96); }
    .cell:disabled { cursor: default; }
    .cell.x { color: #e63946; }
    .cell.o { color: #1d3557; }
    .cell.win { background: #95d5b2; }

    .controls { margin-top: 24px; display: flex; gap: 12px; }

    button.action {
      padding: 10px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ffb703;
      color: #1d3557;
      font-weight: bold;
    }
    button.action:hover { background: #fb8500; color: #fff; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="status" id="status">Player X's turn</div>

  <div class="scores">
    <span>X wins: <strong id="xScore">0</strong></span>
    <span>Draws: <strong id="drawScore">0</strong></span>
    <span>O wins: <strong id="oScore">0</strong></span>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="action" id="restartBtn">New Round</button>
    <button class="action" id="resetBtn">Reset Scores</button>
  </div>

  <script>
    const WINNING_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
      [0, 4, 8], [2, 4, 6]             // diagonals
    ];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const scores = { X: 0, O: 0, draw: 0 };

    let cells = Array(9).fill("");
    let currentPlayer = "X";
    let gameOver = false;

    // Build the 9 cells once
    const buttons = [];
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement("button");
      btn.className = "cell";
      btn.addEventListener("click", () => handleMove(i));
      boardEl.appendChild(btn);
      buttons.push(btn);
    }

    function handleMove(index) {
      if (gameOver || cells[index] !== "") return;

      cells[index] = currentPlayer;
      render();

      const winLine = findWinningLine();
      if (winLine) {
        gameOver = true;
        winLine.forEach(i => buttons[i].classList.add("win"));
        scores[currentPlayer]++;
        updateScores();
        statusEl.textContent = `Player ${currentPlayer} wins!`;
        disableEmptyCells();
        return;
      }

      if (cells.every(c => c !== "")) {
        gameOver = true;
        scores.draw++;
        updateScores();
        statusEl.textContent = "It's a draw!";
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusEl.textContent = `Player ${currentPlayer}'s turn`;
    }

    function findWinningLine() {
      for (const line of WINNING_LINES) {
        const [a, b, c] = line;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          return line;
        }
      }
      return null;
    }

    function render() {
      cells.forEach((value, i) => {
        const btn = buttons[i];
        btn.textContent = value;
        btn.className = "cell" + (value ? " " + value.toLowerCase() : "");
        btn.disabled = value !== "" || gameOver;
      });
    }

    function disableEmptyCells() {
      buttons.forEach(btn => btn.disabled = true);
    }

    function updateScores() {
      document.getElementById("xScore").textContent = scores.X;
      document.getElementById("oScore").textContent = scores.O;
      document.getElementById("drawScore").textContent = scores.draw;
    }

    function newRound() {
      cells = Array(9).fill("");
      currentPlayer = "X";
      gameOver = false;
      buttons.forEach(btn => btn.classList.remove("win"));
      render();
      statusEl.textContent = "Player X's turn";
    }

    function resetScores() {
      scores.X = 0;
      scores.O = 0;
      scores.draw = 0;
      updateScores();
      newRound();
    }

    document.getElementById("restartBtn").addEventListener("click", newRound);
    document.getElementById("resetBtn").addEventListener("click", resetScores);

    render();
  </script>
</body>
</html>
